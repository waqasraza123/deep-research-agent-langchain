[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-agent-langchain"
version = "0.1.0"
description = "Backend-only FastAPI research-agent prototype with planning, source intelligence, evidence, and run lifecycle artifacts."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/deep_research_agent/protocols/**/*.py" = ["E501"]
"src/deep_research_agent/verification/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
disable_error_code = ["call-arg", "arg-type", "attr-defined"]
